
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi primera experiencia AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #aviso {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 10;
      padding: 12px;
      border-radius: 8px;
      background: #153451;
      color: white;
      font-size: 16px;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="aviso">Cargando realidad aumentada...</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="marcador"
      mindar-image-target="targetIndex: 0">

      <a-box
        color="#168BCD"
        width="0.5"
        height="0.5"
        depth="0.5"
        position="0 0 0.5"
        material="shader: standard; color: #168BCD; roughness: 0.5">
      </a-box>

    </a-entity>
  </a-scene>

  <script>
    const escena = document.querySelector("a-scene");
    const aviso = document.querySelector("#aviso");
    const marcador = document.querySelector("#marcador");

    escena.addEventListener("arReady", function () {
      aviso.textContent = "Cámara lista. Apunta al marcador.";
    });

    escena.addEventListener("arError", function () {
      aviso.textContent = "Error al iniciar. Revisa la cámara y los archivos.";
    });

    marcador.addEventListener("targetFound", function () {
      aviso.textContent = "¡Marcador detectado!";
    });

    marcador.addEventListener("targetLost", function () {
      aviso.textContent = "Busca nuevamente el marcador.";
    });
  </script>
</body>
</html>
